name: Dependabot auto-merge
on:
  workflow_call:
    secrets:
      AUTO_MERGE_APP_CLIENT_ID:
        description: Client ID of the GitHub App which enables auto-merge
        required: true
      AUTO_MERGE_APP_PRIVATE_KEY:
        description: Private key of the GitHub App which enables auto-merge
        required: true
# Merging itself is gated by branch protection on the caller's default branch:
# - Require status checks to pass
# - Require branches to be up to date before merging
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      # Versions of 14 digits (date-based Docker tags like 20261026205000) are always
      # reported as semver-major, so update-type is not meaningful for them.
      # Grouped updates are excluded from this exception because new-version only represents
      # the first dependency, while update-type represents the largest update in the group.
      - id: decision
        env:
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          merge=false
          if [[ -z "$DEPENDENCY_GROUP" && "$NEW_VERSION" =~ ^[0-9]{14}$ ]]; then
            merge=true
          elif [[ "$UPDATE_TYPE" != 'version-update:semver-major' ]]; then
            merge=true
          fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
      # Merges done with GITHUB_TOKEN don't trigger workflows on push to main (e.g. Qlty),
      # so auto-merge is enabled with a GitHub App token instead.
      # Workflows permission is required to merge updates of github-actions ecosystem.
      - id: app-token
        if: steps.decision.outputs.merge == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.AUTO_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - if: steps.decision.outputs.merge == 'true'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
